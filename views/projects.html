<section class="page-intro"><div class="wrap"><p class="eyebrow">Likitha Sports</p><h1>Projects</h1><p>Explore the sports surfaces and facilities we work on.</p></div></section>
{% if projectSlides.length %}
<section class="section" aria-label="Project slideshow"><div class="wrap">
{% for slide in projectSlides %}
<figure class="gallery-photo" style="max-width:500px;margin-inline:auto" data-project-slide {% if not loop.first %}hidden{% endif %}>
<img width="500" height="500" style="height:auto" src="{{ slide.image | imageUrl }}" alt="{{ slide.alt }}" {% if not loop.first %}loading="lazy"{% endif %}>
<figcaption>{% if slide.title %}<h2>{{ slide.title }}</h2>{% endif %}{% if slide.description %}<p style="white-space:pre-line">{{ slide.description }}</p>{% endif %}<p>{{ slide.alt }}</p></figcaption>
</figure>
{% endfor %}
{% if projectSlides.length > 1 %}
<script>
(()=>{
  const slides=Array.from(document.querySelectorAll('[data-project-slide]'));
  const motion=window.matchMedia('(prefers-reduced-motion: reduce)');
  let index=0, timer;
  function advance(){
    slides[index].hidden=true;
    index=(index+1)%slides.length;
    slides[index].hidden=false;
  }
  function schedule(){
    clearInterval(timer);
    if(motion.matches){
      slides.forEach(slide=>{slide.hidden=false});
      return;
    }
    slides.forEach((slide,i)=>{slide.hidden=i!==index});
    if(!document.hidden)timer=setInterval(advance,4000);
  }
  document.addEventListener('visibilitychange',schedule);
  motion.addEventListener('change',schedule);
  schedule();
})();
</script>
{% endif %}
</div></section>
{% else %}
<section class="section"><div class="wrap"><h2>Project gallery coming soon</h2></div></section>
{% endif %}
